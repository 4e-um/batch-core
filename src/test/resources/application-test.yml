spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always   # ⭐ Batch 메타 테이블 자동 생성

  h2:
    console:
      enabled: true

logging:
  level:
    org.springframework.batch: INFO
